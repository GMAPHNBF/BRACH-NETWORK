<style>
:root{--blue:#29abe2;--navy:#004a99;--green:#7ab51d;--text:#12263a;--muted:#4f6377;--ok:#14803f;--bad:#c23030;
--glass:rgba(255,255,255,.42);--glass-strong:rgba(255,255,255,.62);--gb:rgba(255,255,255,.75);--shadow:0 8px 32px rgba(0,74,153,.15)}
@media(prefers-color-scheme:dark){:root{--text:#eaf2fa;--muted:#a9bacb;--ok:#5fe39a;--bad:#ff8585;
--glass:rgba(255,255,255,.08);--glass-strong:rgba(255,255,255,.14);--gb:rgba(255,255,255,.22);--shadow:0 8px 32px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Segoe UI',Roboto,Arial,sans-serif;color:var(--text);
background:radial-gradient(circle at 12% 8%,rgba(41,171,226,.55),transparent 42%),radial-gradient(circle at 90% 22%,rgba(122,181,29,.45),transparent 40%),radial-gradient(circle at 50% 100%,rgba(0,74,153,.35),transparent 50%),#e8f3fb;background-attachment:fixed}
@media(prefers-color-scheme:dark){body{background:radial-gradient(circle at 12% 8%,rgba(41,171,226,.35),transparent 42%),radial-gradient(circle at 90% 22%,rgba(122,181,29,.28),transparent 40%),radial-gradient(circle at 50% 100%,rgba(0,74,153,.5),transparent 50%),#0b1520;background-attachment:fixed}}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--gb);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.6)}
header{padding:18px 14px 6px;text-align:center}
.logo-glass{display:inline-block;padding:12px 26px;border-radius:22px;position:relative;overflow:hidden;
background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(255,255,255,.45));
backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(0,74,153,.22),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(255,255,255,.4)}
.logo-glass::before{content:"";position:absolute;top:0;left:-60%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.logo-glass img{height:54px;width:auto;display:block;position:relative}
header h1{margin:10px 0 0;font-size:17px;color:var(--navy);text-shadow:0 1px 0 rgba(255,255,255,.6)}
@media(prefers-color-scheme:dark){header h1{color:#8fd4f5;text-shadow:none}}
header p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.tools{position:sticky;top:0;z-index:5;padding:10px 12px 8px;max-width:960px;margin:0 auto}
.tools-in{padding:10px;border-radius:18px}
.sbox{position:relative}
.sbox input{width:100%;padding:13px 40px 13px 42px;font-size:16px;border:1px solid var(--gb);border-radius:14px;background:var(--glass-strong);color:var(--text);outline:none;box-shadow:inset 0 1px 3px rgba(0,74,153,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sbox input::placeholder{color:var(--muted)}
.sbox input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(41,171,226,.3)}
.sbox .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:17px;opacity:.7}
.sbox .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--glass-strong);color:var(--text);width:26px;height:26px;border-radius:50%;cursor:pointer;display:none}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
select{flex:1;min-width:150px;padding:10px;font-size:14px;border:1px solid var(--gb);border-radius:12px;background:var(--glass-strong);color:var(--text);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
select option{color:#12263a}
.chip{padding:9px 14px;border:1px solid var(--gb);background:var(--glass-strong);color:var(--text);border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6);transition:.2s}
.chip.on{background:linear-gradient(135deg,rgba(0,74,153,.85),rgba(41,171,226,.8));border-color:rgba(255,255,255,.6);color:#fff;box-shadow:0 4px 14px rgba(0,74,153,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.count{max-width:960px;margin:0 auto;padding:4px 18px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.count a{color:var(--navy);cursor:pointer;text-decoration:underline}
@media(prefers-color-scheme:dark){.count a{color:#8fd4f5}}
.grid{max-width:960px;margin:0 auto;padding:6px 12px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{border-radius:20px;padding:15px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;
background:linear-gradient(145deg,var(--glass-strong),var(--glass));backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
border:1px solid var(--gb);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.7)}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--blue)}
.card:nth-child(3n+2)::before{background:var(--green)}
.card:nth-child(3n)::before{background:var(--navy)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-size:16px;font-weight:700;margin:0}
.dist{font-size:11px;color:#fff;background:linear-gradient(135deg,rgba(0,74,153,.9),rgba(41,171,226,.85));padding:3px 9px;border-radius:10px;white-space:nowrap;border:1px solid rgba(255,255,255,.5)}
.addr{font-size:13px;color:var(--muted);line-height:1.4}
.meta{font-size:12.5px;line-height:1.6}
.meta b{color:var(--navy)}
@media(prefers-color-scheme:dark){.meta b{color:#8fd4f5}}
.meta a{color:inherit;word-break:break-all}
.st{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.6)}
.st.o{background:rgba(60,200,120,.25);color:var(--ok)}
.st.c{background:rgba(230,80,80,.2);color:var(--bad)}
.btns{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;text-align:center;padding:11px 6px;border-radius:14px;font-size:14px;font-weight:600;text-decoration:none;color:#fff;position:relative;overflow:hidden;
backdrop-filter:blur(12px) saturate(170%);-webkit-backdrop-filter:blur(12px) saturate(170%);border:1px solid rgba(255,255,255,.55);
text-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s,box-shadow .2s}
.btn::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:scale(.96)}
.btn:hover{transform:translateY(-1px)}
.call{background:linear-gradient(135deg,rgba(122,181,29,.92),rgba(86,150,20,.82));box-shadow:0 6px 18px rgba(122,181,29,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.dir{background:linear-gradient(135deg,rgba(0,74,153,.92),rgba(41,171,226,.82));box-shadow:0 6px 18px rgba(0,74,153,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.mail{flex:0 0 46px;background:var(--glass-strong);color:var(--text);text-shadow:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 12px rgba(0,0,0,.08)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 10px}

body{padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
header{padding-top:calc(14px + env(safe-area-inset-top));position:relative}
.lang{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:4px}
.lang button{padding:6px 9px;border-radius:12px;font-size:12px;border:1px solid var(--gb);background:var(--glass-strong);color:var(--text);cursor:pointer}
.lang button.on{background:var(--navy);color:#fff}
.dchips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.dchips::-webkit-scrollbar{display:none}
.dchips .chip{flex:0 0 auto;padding:7px 12px;font-size:12px}
.mic{position:absolute;right:38px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;cursor:pointer}
.sbox input{padding-right:70px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
mark{background:rgba(122,181,29,.35);color:inherit;border-radius:3px;padding:0 1px}
.fav{border:0;background:none;font-size:22px;cursor:pointer;line-height:1;padding:2px 4px;color:var(--muted)}
.fav.on{color:#f5b301}
.more{flex:0 0 46px;background:var(--glass-strong);color:var(--text);text-shadow:none}
.btn{min-height:46px;display:flex;align-items:center;justify-content:center}
.nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:20;display:flex;justify-content:space-around;padding:6px;border-radius:24px;max-width:520px;margin:0 auto}
.nav button{flex:1;border:0;background:none;color:var(--muted);font-size:11px;padding:6px 2px;border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px}
.nav button i{font-style:normal;font-size:20px}
.nav button.on{background:linear-gradient(135deg,rgba(0,74,153,.88),rgba(41,171,226,.82));color:#fff}
.sheet-bg{position:fixed;inset:0;background:rgba(0,20,40,.45);backdrop-filter:blur(3px);z-index:30;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s;background:var(--glass-strong);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--gb);max-height:88vh;overflow:auto}
@media(prefers-color-scheme:light){.sheet{background:rgba(255,255,255,.85)}}
.sheet.show{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--muted);opacity:.5;margin:0 auto 10px}
.sheet h2{margin:0 0 4px;font-size:20px;color:var(--navy)}
@media(prefers-color-scheme:dark){.sheet h2{color:#8fd4f5}}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts .btn{flex:none}
.acts .ghost{background:var(--glass-strong);color:var(--text);text-shadow:none}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(0,40,80,.9);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:50;display:none}
.top-btn{position:fixed;right:14px;bottom:calc(88px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;border:1px solid var(--gb);background:var(--glass-strong);backdrop-filter:blur(12px);cursor:pointer;font-size:18px;color:var(--text);display:none;z-index:15}
@media(max-width:600px){.grid{grid-template-columns:1fr;padding:6px 10px}.tools{padding:8px 8px 6px}#fNear,#fOpen{display:none}.logo-glass img{height:46px}header{padding-bottom:2px}}
</style>
</head>

var lang="en",st={near:false,open:false,sat:false,saved:false,pos:null},favs=[],rec=[],ALIAS={"Monaragala":"moneragala","Ratnapura":"rathnapura","Nuwara Eliya":"nuwaraeliya"};
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
favs=ls("hnb_fav")||[];rec=ls("hnb_rec")||[];lang=ls("hnb_lang")||"en";
function T(k){return L[lang][k]}
function norm(s){return (s||"").toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
DATA.forEach(function(b,i){b.id=i;b.hay=norm([b.n,b.d,ALIAS[b.d]||"",b.a,b.p,b.t,b.e,b.p.replace(/\s/g,"")].join(" "));b.key=norm(b.n+" "+b.d)});
var dists=[...new Set(DATA.map(function(b){return b.d}))].sort();
function slNow(){var g={};new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Colombo',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()).forEach(function(p){g[p.type]=p.value});return{day:g.weekday,m:parseInt(g.hour,10)*60+parseInt(g.minute,10)}}
function isOpen(b){var t=slNow();if(t.day==="Sun")return false;if(t.day==="Sat")return !!b.s&&t.m>=510&&t.m<780;return t.m>=b.o*60&&t.m<1020}
function km(a,b,c,d){var r=Math.PI/180,x=Math.pow(Math.sin((c-a)*r/2),2)+Math.cos(a*r)*Math.cos(c*r)*Math.pow(Math.sin((d-b)*r/2),2);return 12742*Math.asin(Math.sqrt(x))}
function dirUrl(b){return "https://www.google.com/maps/dir/?api=1&destination="+(b.q?encodeURIComponent(b.q):b.la+","+b.lo)+"&travelmode=driving"}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},1800)}
function vib(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
function hl(txt,q){txt=esc(txt);if(!q)return txt;q.split(' ').forEach(function(t){if(t.length>1)txt=txt.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')});return txt}
function txt(){document.querySelectorAll('[data-t]').forEach(function(e){e.textContent=T(e.dataset.t)});document.querySelectorAll('[data-p]').forEach(function(e){e.placeholder=T(e.dataset.p)});
 $('dist').innerHTML='<option value="">'+T('all')+'</option>'+dists.map(function(d){return '<option value="'+d+'">'+d+' ('+DATA.filter(function(b){return b.d===d}).length+')</option>'}).join('');
 $('sort').innerHTML='<option value="az">'+T('az')+'</option><option value="ns">'+T('ns')+'</option>';
 $('dchips').innerHTML='<button class="chip on" data-d="">'+T('all2')+'</button>'+dists.map(function(d){return '<button class="chip" data-d="'+d+'">'+d+'</button>'}).join('');
 document.querySelectorAll('#lang button').forEach(function(b){b.classList.toggle('on',b.dataset.l===lang)});
 document.documentElement.lang=lang}
function rcnt(){$('recent').innerHTML=rec.length?'<span style="font-size:12px;align-self:center">'+T('recent')+'</span>'+rec.map(function(r){return '<button class="chip" style="padding:5px 10px;font-size:12px" data-r="'+esc(r)+'">'+esc(r)+'</button>'}).join(''):''}
function render(){
 var q=norm($('q').value),ds=$('dist').value,toks=q?q.split(' '):[],sort=$('sort').value;
 document.querySelectorAll('#dchips .chip').forEach(function(c){c.classList.toggle('on',c.dataset.d===ds)});
 var res=DATA.filter(function(b){return(!ds||b.d===ds)&&(!st.sat||b.s)&&(!st.open||isOpen(b))&&(!st.saved||favs.indexOf(b.id)>-1)&&toks.every(function(t){return b.hay.indexOf(t)>-1})});
 var near=(st.near||sort==="ns")&&st.pos;
 if(near){res.forEach(function(b){b.km=b.la!=null?km(st.pos.lat,st.pos.lng,b.la,b.lo):null});res.sort(function(a,b){return(a.km==null?1e9:a.km)-(b.km==null?1e9:b.km)})}
 else res.sort(function(a,b){var x=q&&a.key.indexOf(q)>-1?0:1,y=q&&b.key.indexOf(q)>-1?0:1;return x-y||a.n.localeCompare(b.n)});
 $('cnt').textContent=res.length+" / "+DATA.length+" "+T('of');$('clr').style.display=q?'block':'none';
 $('list').innerHTML=res.map(function(b){var o=isOpen(b),f=favs.indexOf(b.id)>-1;
  return '<div class="card"><div class="top"><h3 class="name">'+hl(b.n,q)+'</h3>'+(near&&b.km!=null?'<span class="dist">'+b.km.toFixed(1)+' km</span>':'')+'<button class="fav'+(f?' on':'')+'" data-f="'+b.id+'" aria-label="Save">'+(f?'\u2605':'\u2606')+'</button></div>'+
  '<div class="addr">'+hl(b.a,q)+'</div><div class="meta"><b>'+T('dis')+':</b> '+hl(b.d,q)+' &nbsp;<span class="st '+(o?'o':'c')+'">'+(o?T('on'):T('off'))+'</span></div>'+
  '<div class="btns"><a class="btn call" href="tel:'+b.t+'">&#128222; '+T('call')+'</a><a class="btn dir" target="_blank" rel="noopener" href="'+dirUrl(b)+'">&#128205; '+T('dir')+'</a><a class="btn more" data-m="'+b.id+'" href="#">&#8942;</a></div></div>'}).join('')||'<div class="empty">'+T('none')+'</div>'}
function sheet(id){var b=DATA[id],f=favs.indexOf(id)>-1;
 $('sheet').innerHTML='<div class="grab"></div><h2>'+esc(b.n)+'</h2><div class="addr">'+esc(b.a)+'</div><div class="meta" style="margin-top:8px"><b>'+T('dis')+':</b> '+esc(b.d)+'<br><b>'+T('ph2')+':</b> <a href="tel:'+b.t+'">'+b.p+'</a><br><b>'+T('em')+':</b> <a href="mailto:'+esc(b.e)+'">'+esc(b.e)+'</a><br><b>'+T('hr')+':</b> '+T('wd')+' '+(b.o===9?'9.00am':'8.30am')+' - 5.00pm'+(b.s?' | '+T('sa')+' 8.30am - 1.00pm':'')+'</div>'+
 '<div class="acts"><a class="btn call" href="tel:'+b.t+'">&#128222; '+T('call')+'</a><a class="btn dir" target="_blank" rel="noopener" href="'+dirUrl(b)+'">&#128205; '+T('dir')+'</a>'+
 '<a class="btn ghost" href="mailto:'+esc(b.e)+'">&#9993; '+T('em')+'</a><a class="btn ghost" id="shr" href="#">&#128228; '+T('share')+'</a><a class="btn ghost" id="cpy" href="#">&#128203; '+T('copy')+'</a><a class="btn ghost" id="sfv" href="#">'+(f?'\u2605 ':'\u2606 ')+T('sv')+'</a></div>';
 $('sbg').style.display='block';requestAnimationFrame(function(){$('sheet').classList.add('show')});
 var txtS='HNB Finance - '+b.n+'\n'+b.a+'\n'+b.p+'\n'+dirUrl(b);
 $('shr').onclick=function(e){e.preventDefault();if(navigator.share)navigator.share({title:'HNB Finance '+b.n,text:txtS}).catch(function(){});else window.open('https://wa.me/?text='+encodeURIComponent(txtS))};
 $('cpy').onclick=function(e){e.preventDefault();try{navigator.clipboard.writeText(b.a+', '+b.n).then(function(){toast(T('copied'))})}catch(x){}};
 $('sfv').onclick=function(e){e.preventDefault();tf(id);sheet(id)}}
function closeS(){$('sheet').classList.remove('show');setTimeout(function(){$('sbg').style.display='none'},250)}
function tf(id){var i=favs.indexOf(id);i>-1?favs.splice(i,1):favs.push(id);ls("hnb_fav",favs);vib();render()}
function locate(cb){if(st.pos)return cb();if(!navigator.geolocation){toast(T('nolo'));return}toast(T('cl'));
 navigator.geolocation.getCurrentPosition(function(p){st.pos={lat:p.coords.latitude,lng:p.coords.longitude};cb()},function(){toast(T('nolo'))},{enableHighAccuracy:true,timeout:10000})}
function setNav(n){document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.n===n)})}
function chip(id,k){$(id).onclick=function(){st[k]=!st[k];this.classList.toggle('on',st[k]);render()}}
chip('fOpen','open');chip('fSat','sat');
$('fNear').onclick=function(){var b=this;if(st.near){st.near=false;b.classList.remove('on');render();return}locate(function(){st.near=true;b.classList.add('on');render()})};
$('nav').onclick=function(e){var b=e.target.closest('button');if(!b)return;var n=b.dataset.n;vib();setNav(n);st.saved=n==='saved';st.open=n==='open';st.near=false;$('fOpen').classList.toggle('on',st.open);$('fNear').classList.remove('on');
 if(n==='near')locate(function(){st.near=true;$('fNear').classList.add('on');render()});else render();window.scrollTo({top:0,behavior:'smooth'})};
$('list').onclick=function(e){var f=e.target.closest('[data-f]'),m=e.target.closest('[data-m]');if(f)tf(+f.dataset.f);if(m){e.preventDefault();sheet(+m.dataset.m)}};
$('sbg').onclick=closeS;
$('dchips').onclick=function(e){var c=e.target.closest('.chip');if(c){$('dist').value=c.dataset.d;render()}};
$('dist').onchange=render;$('sort').onchange=function(){if(this.value==='ns')locate(render);else render()};
$('recent').onclick=function(e){var c=e.target.closest('[data-r]');if(c){$('q').value=c.dataset.r;render()}};
$('q').addEventListener('input',render);
$('q').addEventListener('change',function(){var v=this.value.trim();if(v.length>1){rec=[v].concat(rec.filter(function(r){return r!==v})).slice(0,5);ls("hnb_rec",rec);rcnt()}});
$('clr').onclick=function(){$('q').value='';render();$('q').focus()};
$('reset').onclick=function(){$('q').value='';$('dist').value='';st.near=st.open=st.sat=st.saved=false;['fNear','fOpen','fSat'].forEach(function(i){$(i).classList.remove('on')});setNav('all');render()};
$('lang').onclick=function(e){var b=e.target.closest('button');if(b){lang=b.dataset.l;ls("hnb_lang",lang);var d=$('dist').value,s=$('sort').value;txt();$('dist').value=d;$('sort').value=s;rcnt();render()}};
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR)$('mic').style.display='none';else $('mic').onclick=function(){var r=new SR();r.lang=lang==='si'?'si-LK':lang==='ta'?'ta-LK':'en-LK';r.onresult=function(e){$('q').value=e.results[0][0].transcript;render()};try{r.start();toast('\uD83C\uDF99...')}catch(x){}};
window.addEventListener('scroll',function(){$('topb').style.display=window.scrollY>500?'block':'none'});
$('topb').onclick=function(){window.scrollTo({top:0,behavior:'smooth'})};
txt();rcnt();render();setInterval(render,60000);
</script>
